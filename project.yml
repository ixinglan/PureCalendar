name: CalendarApp

options:
  bundleIdPrefix: com.ixiaoqiang
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:

  # 主 App
  CalendarApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: CalendarApp
        PRODUCT_BUNDLE_IDENTIFIER: com.ixiaoqiang.calendarapp
        INFOPLIST_FILE: Sources/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: ""
    dependencies:
      - target: CalendarWidget
        embed: true

  # 小组件扩展
  CalendarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
        excludes:
          - "Info.plist"
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: CalendarWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.ixiaoqiang.calendarapp.widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  # UI 测试：滚动性能（真实触摸手势，测滚动卡顿指标）
  CalendarAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: CalendarApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ixiaoqiang.calendarapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  CalendarApp:
    build:
      targets:
        CalendarApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalendarAppUITests
